{% extends "base.html" %}
{% block title %}로그인 • Instagram{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-box">
    <h1 class="logo big">Instagram</h1>
    <form method="post" action="/login" class="auth-form">
      <input name="user_id" placeholder="사용자 아이디" value="{{ user_id or '' }}" required autofocus>
      <input name="password" type="password" placeholder="비밀번호" required>
      <button class="btn-primary" type="submit">로그인</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
  <div class="auth-box small">계정이 없으신가요? <a href="/signup">가입하기</a></div>
</div>
{% endblock %}
