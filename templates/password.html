{% extends "base.html" %}
{% block title %}비밀번호 변경 • Instagram{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>비밀번호 변경</h2>
  <form method="post" action="/settings/password" class="stack">
    <label>현재 비밀번호<input name="current" type="password" required></label>
    <label>새 비밀번호<input name="new" type="password" required></label>
    <label>새 비밀번호 확인<input name="confirm" type="password" required></label>
    <button class="btn-primary" type="submit">비밀번호 변경</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</div>
{% endblock %}
