<div class="person">
  <a href="/u/{{ u.user_id }}">{{ avatar(u.user_id, 44) }}</a>
  <div class="grow"><a class="uname" href="/u/{{ u.user_id }}">{{ u.user_id }}</a><div class="muted">{{ u.display_name }}</div></div>
  {% if u.user_id != me %}
    {% if u.i_follow %}
    <form method="post" action="/u/{{ u.user_id }}/unfollow"><input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}"><button class="btn-gray">팔로잉</button></form>
    {% else %}
    <form method="post" action="/u/{{ u.user_id }}/follow"><input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}"><button class="btn-primary inline">팔로우</button></form>
    {% endif %}
  {% endif %}
</div>
